spring.application.name=juris-home-login-seguro

# Em produção, MONGODB_URI deve conter o URI mongodb+srv do Atlas e ficar fora do repositório.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/juris_home_auth}
spring.data.mongodb.auto-index-creation=true

# A configuração Java usa a coleção "sessions" com timeout de 30 minutos.
server.servlet.session.timeout=30m

# COOKIE_SECURE=true em produção com HTTPS; mantenha false somente no desenvolvimento local HTTP.
app.security.cookie-secure=${COOKIE_SECURE:false}
app.bootstrap.admin-username=${INITIAL_ADMIN_USERNAME:}
app.bootstrap.admin-email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:}

app.ui.theme=${UI_THEME:juris}

spring.thymeleaf.cache=true
server.error.whitelabel.enabled=false
